name: Deploy to production

# main is production. Nothing else deploys.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys touch the VPS at once, and never cancel one halfway: an interrupted
# deploy can leave the stack on mismatched image versions.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Backend build and test
        run: |
          dotnet restore Planning.slnx
          dotnet build Planning.slnx --configuration Release --no-restore
          dotnet test Planning.slnx --configuration Release --no-build

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: Planning.Web/pnpm-lock.yaml

      - name: Frontend lint, test and build
        working-directory: Planning.Web
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run test
          pnpm run build

  build:
    name: Build images
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: Planning.Api/Dockerfile
            context: .
          - name: web
            dockerfile: Planning.Web/Dockerfile
            context: Planning.Web
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # The commit SHA is the real tag - it is what makes a rollback a one-line change.
          # latest just follows along for convenience.
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/planningsystem-${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/planningsystem-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Open an SSH session to the VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key rather than StrictHostKeyChecking=no, so a swapped-out server
          # fails the deploy instead of silently accepting a new identity.
          echo "${{ secrets.VPS_SSH_HOST_KEY }}" > ~/.ssh/known_hosts

      - name: Pull the new images and restart the stack
        env:
          # A short-lived token for the pull, so the VPS never stores a registry credential.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "IMAGE_TAG='${{ github.sha }}' GHCR_TOKEN='$GHCR_TOKEN' GHCR_ACTOR='${{ github.actor }}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/planning

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

          # Record the tag we are moving to, keeping the previous one for a rollback.
          if grep -q '^IMAGE_TAG=' .env; then
            grep '^IMAGE_TAG=' .env | sed 's/^IMAGE_TAG=/PREVIOUS_IMAGE_TAG=/' > .previous_tag
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env
          else
            echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
          fi

          docker compose pull api web
          docker compose up -d --remove-orphans

          docker logout ghcr.io
          REMOTE

      - name: Wait for the API to report ready
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/planning

          # /health/ready includes the database, so this only passes once migrations have
          # applied and the API can actually serve traffic.
          for attempt in $(seq 1 30); do
            if docker compose exec -T api curl -fsS http://localhost:8080/health/ready > /dev/null 2>&1; then
              echo "API ready after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 5
          done

          echo "API did not become ready. Recent logs:"
          docker compose logs --tail 60 api
          exit 1
          REMOTE

      - name: Report the deployed version
        if: success()
        run: echo "Production is now running ${{ github.sha }}."

      - name: Explain how to roll back
        if: failure()
        run: |
          echo "Deploy failed. To roll back, on the VPS in /opt/planning:"
          echo "  set IMAGE_TAG in .env to the previous SHA (see .previous_tag)"
          echo "  docker compose pull api web && docker compose up -d"
